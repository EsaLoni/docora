name: UDIP Continuous Integration & Security Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ============================================================================
  # 1. Backend Verification (Python 3.13)
  # ============================================================================
  backend-test:
    name: Backend Tests & Migration Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: udip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libmagic-dev

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Validate Alembic Migrations
        working-directory: ./backend
        env:
          DATABASE_SYNC_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/udip_test
        run: |
          alembic upgrade head

      - name: Execute Full Test Suite
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: testing-insecure-key-min-32-chars-length!!
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_SYNC_URL: sqlite:///:memory:
          STORAGE_PROVIDER: local
          ALLOW_DEV_AUTH: "true"
        run: |
          pytest tests -v --cov=app --cov-report=term-missing

  # ============================================================================
  # 2. Frontend Verification (Next.js 16 / Node.js 24)
  # ============================================================================
  frontend-build:
    name: Frontend Lint, Typecheck & Standalone Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Next.js Standalone Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build
