[project]
name = "udip-backend"
version = "0.1.0"
description = "Universal Document Intelligence Platform - Backend Modular Monolith API"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "pyjwt[crypto]>=2.10.0",
    "aiosqlite>=0.20.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "pytesseract>=0.3.10",
    "python-pptx>=1.0.0",
    "fastembed>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:anyio -p no:asyncio"
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore:.*fitz.*:FutureWarning",
]
