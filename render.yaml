# ==============================================================================
# Docora — Render Blueprint Specification (Zero-Cost Free Tier MVP)
# ==============================================================================
# Single Render Free Web Service with integrated in-process worker task.
# Strict $0/month budget: Zero paid services, zero card required.
# Connects to external Supabase (PostgreSQL + Storage) and Google Gemini API.

services:
  # 1. FastAPI Web Service (REST APIs, Auth, SSE Streaming, OCR, RAG & In-Process Worker)
  - type: web
    name: docora-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health/live
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: udip-documents
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL_NAME
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ENABLE_IN_PROCESS_WORKER
        value: "true"
