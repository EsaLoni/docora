# ==============================================================================
# Docora — Render Blueprint Specification (Infrastructure-as-Code)
# ==============================================================================
# Defines both the FastAPI Web Service and the Standalone Background Worker.
# Connects to external Supabase (PostgreSQL + Storage) and Google Gemini API.

services:
  # 1. FastAPI Web Service (REST APIs, Auth, SSE Streaming, OCR, RAG)
  - type: web
    name: docora-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: standard
    healthCheckPath: /health/live
    numInstances: 1
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: udip-documents
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL_NAME
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: RATE_LIMIT_ENABLED
        value: "true"

  # 2. Durable Background Worker (Document Ingestion, Chunking, Embeddings, Intelligence)
  - type: worker
    name: docora-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: python -m app.services.worker.runner
    plan: standard
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: SECRET_KEY
        fromService:
          type: web
          name: docora-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: udip-documents
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL_NAME
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2.0"
      - key: WORKER_MAX_RETRIES
        value: "3"
      - key: WORKER_BATCH_SIZE
        value: "5"
      - key: WORKER_STALE_JOB_TIMEOUT_MINUTES
        value: "15"
      - key: WORKER_HEALTHCHECK_FILE
        value: /tmp/worker_heartbeat.json
